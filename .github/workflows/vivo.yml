name: Desenhos vivos

# Refaz os números e a cobrinha com os dados de agora e publica no ramo "vivo".
# Nada entra no main, então o histórico e o gráfico de contribuições ficam como estão.

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06h17 de São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/vivo.yml']

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - name: Gera os desenhos
        run: python3 tools/gerar.py --vivo vivo
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publica no ramo "vivo"
        working-directory: vivo
        run: |
          git init -q -b vivo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Desenhos de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" vivo
        env:
          GH_TOKEN: ${{ github.token }}
